# 관심소식 JSON 레코드 → TB_NEWS 목표필드 직접 매핑 (모니모)
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: monimo_news
#       extractor: json_mapping
#       config_file: custom_field_monimo_news.yaml
#
# 원천: ssc_rag_adin_yyyymmdd_delta_001.json (카드 WCMS)
#
# TB_NEWS 테이블 설명: "관심소식 목록입니다. 이벤트와 같은 구조이며, 종료일이 지나면
# 검색에서 자동으로 빠집니다." — 실제로 원천 JSON 도 이벤트와 같은 eventList 구조다.
# custom_field_monimo_event.yaml 과 짝을 이루므로 한쪽을 고치면 다른 쪽도 함께 본다.
#
# TB_EVENT 와의 차이:
#   - 시작일 컬럼이 없다(NEWS_TO 만 있는 기간 게이트)
#   - KEYW_CTGR_NM(키워드구분명) 과 CN_URL(콘텐츠 상세 경로) 가 추가된다
#
# 입력 예시(관심소식 시트의 "공통 표준 레이아웃"):
#   {"eventList": [{"ID": "CM26061182", "회사명": "모니모",
#                   "제목": "하이마트 구독을 가볍게 매월 최대2만원 까지 혜택",
#                   "카테고리": "가전", "키워드": "하이마트 구독",
#                   "개시 시작일": "260701", "개시 종료일": "260731",
#                   "사용여부": "N", "노출여부": "Y",
#                   "wcmsHtml": {"htmlText": "상세 내용"}}]}

schema: v2

# 문서구조 v1
# source:
#   kind: records
#   records_at: eventList
#   on_missing: error
# fields:
#   BIZ_ID:
#     alias: [ID, 아이디]
#     default: null
#   GROUP_C:
#     alias: [회사명, corp_code, 고객사]
#     default: IFP
#     values:
#       IFP: [모니모]
#       SLF: [삼성생명, 생명]
#       SSF: [삼성화재, 화재]
#       HPP: [삼성카드, 카드]
#       SSS: [삼성증권, 증권]
#   TITLE:
#     alias: [제목, title, evtTodayMainCopy]
#   KEYW_CTGR_NM:
#     alias: [카테고리, 키워드, 코너명]
#     default: null
#   CN_URL:
#     alias: [buttonLink, detailUrl, 콘텐츠 상세 경로, 상세경로]
#   NEWS_TO:
#     alias: [개시 종료일, 종료일, endDate, evtPtrmEndDt]
#     transform: date_int_flex
#   DETAIL_HTML:
#     alias: [htmlText, 상세내용]
#   # DETAIL_HTML 과 **같은 원천**을 한 번 더 읽어 평문 사본을 만든다. 원본 HTML 은
#   # metadata 로만 싣고 임베딩 입력은 이 평문을 쓴다.
#   # `html_text` 는 HTML 로 강제 평문화한다(표·목록 구조 유지).
#   DETAIL_TEXT:
#     alias: [htmlText, 상세내용]
#     transform: html_text
# require:
#   fields: [TITLE]
# body:
#   fields: [TITLE, DETAIL_TEXT]
#   labels:
#     TITLE: 제목
#     DETAIL_TEXT: 상세내용
#   split: true
#   repeat: [TITLE]

# 문서구조 v2
source:
  kind: document
  pre:
    marker_headings: true
    json:
      body_from: [content]
      format: auto
      on_missing: skip
fields:
  BIZ_ID:
    alias: [ID, id]
    default: null
  GROUP_C:
    default: IFP
  USE_YN:
    default: Y
llm:
- out: [TITLE, CATEGORY, SUMMARY, DETAIL, SOURCE]
  parser:
    type: json
  endpoint:
    url: https://genos.genon.ai/api/gateway/rep/serving/752/v1/chat/completions
    api_key: d1a9e0acab6243019008a96cd8af868e
    model: model
  params:
    max_tokens: 4000
    temperature: 0.0
    timeout: 300
  prompt:
    system: |
      너는 문서 정보추출 전문가다. 주어진 문서에서 요청한 필드를 정확하게 추출한다.

      규칙:
      - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
      - 키는 아래 필드명을 그대로 쓴다.
      - 원문에 없는 정보를 지어내지 않는다(환각 금지). 없으면 값을 null 로 둔다.
      - `TITLE`: class가 new-banner-headline 로 표기된 값
      - `CATEGORY`: class가 newsletter-title 로 표기된 값
      - `SUMMARY`: article-summary-box로 표기된 값
      - `DETAIL`: class가 newsletter-article-content 로 표기된 값
      - `SOURCE`: class가 newsletter-source 로 표기된 값
    user: |
      다음 문서에서 TITLE, CATEGORY, SUMMARY, DETAIL, SOURCE 필드를 추출하라.

      <document>
      {{raw_text}}
      </document>
