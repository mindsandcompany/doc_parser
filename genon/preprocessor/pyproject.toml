[project]
name = "doc-parser-preprocessor"
version = "1.3.0"
description = ""
authors = [{ name = "Seunghyun Nam", email = "seunghyun.nam@genon.ai" }]
requires-python = '>=3.11,<4.0'
dependencies = [
    "docling-core==2.62.0",
    "docling-ibm-models==3.10.3",
    "docling-parse==4.1.0",
    "python-multipart==0.0.22",
    "gunicorn==23.0.0",
    "uvicorn==0.21.1",
    # CVE-2026-25087: pyarrow 22.0.0 취약, 23.0.1로 상향.
    "pyarrow==23.0.1",
    "starlette>=0.52.1",
    "aiofiles==24.1.0",
    # CVE-2026-69244: aiohttp 3.13.3 취약, 3.14.3 이상으로 상향. 상한은 다음 메이저 전.
    "aiohttp>=3.14.3,<4",
    "httpx>=0.27.0",
    "transformers==4.57.6",
    "accelerate==1.12.0",
    "unstructured==0.18.32",
    "python-pptx==1.0.2",
    "python-docx==1.1.2",
    "python-magic==0.4.27",
    "pyhwp==0.1b15",
    "markdown==3.8.2",
    "pydub==0.25.1",
    "weasyprint==68.1",
    "aiofile==3.9.0",
    "watchfiles==1.1.0",
    "pika==1.3.2",
    "chardet==5.2.0",
    'wand',
    'grpcio',
    'grpcio-tools',
    "fastapi>=0.115.12",
    "pymupdf>=1.26.4",
    "pydub>=0.25.1",
    "langchain>=1.2.10",
    "langchain-core>=1.2.11",
    "langchain-community>=0.4.1",
    "numpy>=2.3.4",
    "markdown2>=2.5.4",
    "audioop-lts; python_version >= '3.13'",
    # CVE-2025-64512: pdfminer.six 20250506 취약, 수정본 20251107로 상향(날짜 버전이라 정확 고정).
    "pdfminer-six==20251107",
    "docling",
    "hatchling>=1.27.0",
    "pi-heif==0.22.0",
    "unstructured-inference>=1.2.0",
    "pdf2image==1.17.0",
    "unstructured-pytesseract==0.3.15",
    "pytesseract==0.3.13",
    "opencv-python>=4.11.0.86",
    "numpy==2.3.4",
    "minio==7.2.20",
]

[dependency-groups]
dev = [
    "pre-commit~=3.7",
    "mypy~=1.10",
    "types-setuptools~=70.3",
    "pandas-stubs~=2.1",
    "types-openpyxl~=3.1",
    "types-requests~=2.31",
    "boto3-stubs~=1.37",
    "types-urllib3~=1.26",
    "types-tqdm~=4.67",
    "coverage~=7.6",
    "pytest~=8.4.2",
    "pytest-cov>=6.1.1",
    "pytest-dependency~=0.6",
    "pytest-xdist~=3.3",
    "ipykernel~=6.29",
    "ipywidgets~=8.1",
    "nbqa~=1.9",
    "python-semantic-release~=7.32",
    "pytest-asyncio>=1.2.0"
]

[tool.uv]
# CVE-2026-23949(jaraco.context 5.3.0), CVE-2026-24049(wheel 0.45.1): venv setuptools의 _vendor 패치본 하한 81.0.0.
# 상한은 다음 메이저 전.
constraint-dependencies = ["setuptools>=81.0.0,<85"]

[tool.uv.sources]
docling = [
    { path = "../.." }
]

[tool.hatch.build.targets.sdist]
include = ["src/**/*", "*.json"]

[tool.hatch.build.targets.wheel]
include = ["src/**/*", "*.json"]

[tool.hatch.build.targets.wheel.sources]
"src/**/*" = "*"
"*.json" = "*"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -m \"not update_baseline\""
markers = [
    "smoke: 핵심 경로가 죽지 않는지 빠르게 확인하는 smoke 테스트",
    "unit: 격리된 함수/클래스 단위 테스트",
    "regression: baseline과 비교하여 회귀를 감지하는 테스트",
    "update_baseline: baseline 데이터를 (재)생성하는 유틸리티 (일반 실행에서 제외)",
]

[tool.hatch.metadata]
allow-direct-references = true  # Direct reference 허용
